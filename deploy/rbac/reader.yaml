apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesleuth-agent
  namespace: kubesleuth-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesleuth-reader
  namespace: kubesleuth-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesleuth-reader
  namespace: kubesleuth-lab
subjects:
  - kind: ServiceAccount
    name: kubesleuth-agent
    namespace: kubesleuth-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubesleuth-reader
