apiVersion: v1
kind: ServiceAccount
metadata:
  name: kumoshindan-agent
  namespace: kumoshindan-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kumoshindan-reader
  namespace: kumoshindan-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kumoshindan-reader
  namespace: kumoshindan-lab
subjects:
  - kind: ServiceAccount
    name: kumoshindan-agent
    namespace: kumoshindan-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kumoshindan-reader
