apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-loop-demo
  namespace: kumoshindan-lab
  labels:
    app: crash-loop-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-loop-demo
  template:
    metadata:
      labels:
        app: crash-loop-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["echo 'KumoShindan demo: intentional crash'; sleep 2; exit 1"]
