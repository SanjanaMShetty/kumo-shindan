apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: kubesleuth-lab
  labels: {app: checkout-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout-api}
  template:
    metadata:
      labels: {app: checkout-api}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "starting checkout-api"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: required environment variable DATABASE_URL is not set" >&2
                exit 1
              fi
              sleep 3600
