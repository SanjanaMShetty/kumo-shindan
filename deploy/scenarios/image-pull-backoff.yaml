apiVersion: v1
kind: Namespace
metadata:
  name: kubesleuth-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: kubesleuth-lab
  labels:
    app: broken-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image
  template:
    metadata:
      labels:
        app: broken-image
    spec:
      containers:
        - name: app
          image: kubesleuth-does-not-exist.invalid/demo:missing
