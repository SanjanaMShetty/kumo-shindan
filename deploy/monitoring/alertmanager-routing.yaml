alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 12h
      routes:
        - receiver: kubesleuth
          matchers:
            - 'namespace="kubesleuth-lab"'
    receivers:
      - name: "null"
      - name: kubesleuth
        webhook_configs:
          - url: http://kubesleuth.kubesleuth.svc.cluster.local:8000/webhook/alertmanager
            send_resolved: false
