[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubesleuth"
version = "0.1.0"
description = "A read-only LangGraph agent for investigating Kubernetes incidents"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "kubernetes>=29.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]
ollama = ["langchain-ollama>=0.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "llm: needs an LLM API key",
  "cluster: needs a live Kubernetes cluster",
]
